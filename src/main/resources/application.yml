spring:
  application:
    name: qr-code-generator

  # The Basic identity, an OPERATOR. Override QR_CODE_PASSWORD or spring.security.user.password;
  # leaving this default in place means anyone who can reach the port can sign in.
  security:
    user:
      name: operator
      password: ${QR_CODE_PASSWORD:${SPRING_SECURITY_USER_PASSWORD:change-me-on-deploy}}

  mvc:
    # RFC 9457 error bodies, so a rejected request explains itself instead of returning an
    # empty body with a status.
    problemdetails:
      enabled: true

  # Short links are user data: they have to survive a restart, so the default is a file rather
  # than an in-memory database. AUTO_SERVER lets a second process (such as an H2 console) open
  # the same file while the app is running.
  #
  # A deployment with Postgres only has to set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
  # and SPRING_DATASOURCE_PASSWORD. The driver is inferred from the URL, so nothing else changes.
  datasource:
    url: jdbc:h2:file:./data/qr-code-generator;AUTO_SERVER=TRUE
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway creates the tables. Validating rather than updating means a mapping that no
      # longer matches the migrations fails at startup instead of quietly changing a table.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

app:
  # Who may use the generator. "basic" asks for the spring.security.user identity above, an
  # OPERATOR who may create, edit and delete short links; add names to viewer-users to hand the
  # same password to people who should only render codes and list links. Set the mode to "oidc"
  # to sign people in through an identity provider, to "header" to trust the identity a reverse
  # proxy asserts (both in the README), or to "none" to turn sign-in off, which is what the test
  # suite does. The short-link redirects are public in every mode.
  security:
    mode: ${APP_SECURITY_MODE:basic}
    operator-users: []
    viewer-users: []

    # With mode: oidc the role claim and the operator groups decide who may change links.
    # roles-claim: groups        # Okta default; use "roles" for Microsoft Entra ID
    # operator-groups: []

    # With mode: header the reverse proxy signs people in and sets these two headers, and the
    # allowlist says whose connections the identity is believed on. Startup refuses mode:
    # header without both a header and an allowlist.
    #   header: X-Auth-Request-User
    #   groups-header: X-Auth-Request-Groups
    #   trusted-proxies: [127.0.0.1/32]

  # The address a phone must be able to reach. The default is only right for this machine:
  # a code scanned elsewhere has to point at a LAN address or the name behind a reverse proxy.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Loopback only by default: this is a local tool, and a QR generator on an open port invites
# strangers to use it as a rendering service. Override SERVER_ADDRESS when it should be
# reachable from another machine.
server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
