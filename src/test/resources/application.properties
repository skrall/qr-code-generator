# Overrides only the datasource. The main application.yml still loads, so the problem-detail
# settings and app.public-base-url apply to tests as well. Properties take precedence over YAML,
# which is why this can sit beside it rather than replacing it.
spring.datasource.url=jdbc:h2:mem:qr-code-generator-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
