version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node describes the Node that runs the build, which is node.version in
      # pom.xml, currently v26.13.0. Taking 27+ would describe a runtime the build does
      # not use. Bump this line in lockstep with node.version.
      - dependency-name: "@types/node"
        versions: ["27.x"]
      # TypeScript 7 is the native compiler and does not export the ./lib/tsc subpath
      # that vue-tsc resolves, so the typecheck cannot start. Lift once vue-tsc
      # supports the native compiler.
      - dependency-name: typescript
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
