name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify builds the UI as well: it downloads the Node pinned in pom.xml, runs
      # npm ci, vue-tsc, vite build and the Vitest suite, then runs the Java tests.
      - name: Verify
        run: ./mvnw -B --batch-mode verify
